packages:
  - "apps/*"
  - "packages/*"

# Install settings
autoInstallPeers: true
engineStrict: true

# Supply-chain settings
# Refuse package versions published less than 24 hours ago so a compromised
# release can be yanked before it reaches this repository.
minimumReleaseAge: 1440
# Only packages listed here may run install/postinstall scripts. Add a
# package here after reviewing why it needs a build step.
onlyBuiltDependencies: []
# Fail the install (instead of silently skipping) when a dependency has a
# build script that is neither allowlisted above nor explicitly ignored.
strictDepBuilds: true

catalog:
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.0
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^24.0.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": ^4.1.11
  eslint: ^10.9.1
  jiti: ^2.6.1
  jsdom: ^26.1.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
