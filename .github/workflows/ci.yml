name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lockfile
            script: dedupe:check
          - name: Lint
            script: lint
          - name: Unused code
            script: knip
          - name: Formatting
            script: format:check
          - name: Types
            script: check-types
          - name: Build
            script: build
          - name: Tests and coverage
            script: report
          - name: End-to-end
            script: test:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned in .node-version; keep it equal to the engines floor in package.json.
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          # One cache per check so each job restores its own task results. The SHA
          # makes every run save a fresh entry; the prefix falls back to the latest.
          key: turbo-${{ runner.os }}-${{ matrix.script }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.script }}-

      - name: Read Playwright version
        id: playwright
        if: ${{ matrix.script == 'test:e2e' }}
        # The installed version comes from the frozen lockfile. Assigning it
        # first fails the step if the command fails, rather than keying the
        # cache on an empty version.
        run: |
          version=$(pnpm --filter @repo/playwright-config exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        if: ${{ matrix.script == 'test:e2e' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: ${{ matrix.script == 'test:e2e' }}
        # Skips the download when the cache restored this version; the system
        # libraries are not cached and install every run. Headless runs only
        # need the headless shell, which keeps the cache small.
        run: pnpm --filter @repo/playwright-config exec playwright install --with-deps --only-shell chromium

      - name: Run ${{ matrix.name }}
        run: pnpm run "$CHECK_SCRIPT"
        env:
          CHECK_SCRIPT: ${{ matrix.script }}

      - name: Upload coverage and test reports
        if: ${{ !cancelled() && matrix.script == 'report' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            packages/vitest-config/coverage/report/
            apps/*/coverage/blob/
            packages/*/coverage/blob/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright reports
        # Runs on success too: a test that passes on retry leaves the job green
        # but records a trace for the failed attempt, which is worth keeping.
        if: ${{ !cancelled() && matrix.script == 'test:e2e' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          if-no-files-found: warn
          retention-days: 7

  required:
    name: CI passed
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        run: test "$CHECKS_RESULT" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
